<!doctype html>
<html><head><meta charset="utf-8"><title>Gaffer demo frame</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:800px;overflow:hidden}
  body{background:radial-gradient(1100px 700px at 15% 10%,#12684A 0%,#0B3D2E 55%,#072A1F 100%);color:#EAF2EC;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex}
  .left{flex:1;padding:56px 24px 44px 72px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:.01em}
  .brand i{width:34px;height:34px;border-radius:10px;background:#2BC27C;display:inline-block}
  .brand small{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7FE3B0;margin-left:6px}
  #cap{transition:opacity .25s ease,transform .25s ease}
  #cap.out{opacity:0;transform:translateY(8px)}
  .step{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7FE3B0}
  .title{font-size:48px;line-height:1.06;font-weight:800;letter-spacing:-.02em;margin:14px 0 18px;text-wrap:balance}
  .body{font-size:23px;line-height:1.42;color:#C9DBD0;max-width:600px;text-wrap:pretty}
  .note{font-size:15px;color:#F2B63D;min-height:22px;font-weight:600}
  .phone{margin:6px 64px 6px 0;padding:14px;border-radius:48px;background:#04100A;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 2px #1E2F26;height:788px}
  iframe{width:390px;height:760px;border:0;border-radius:34px;background:#fff;display:block}
  .cursor{position:fixed;left:-50px;top:-50px;width:30px;height:30px;border-radius:50%;background:rgba(255,224,102,.92);
    border:3px solid #fff;transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.3,.7,.3,1),top .45s cubic-bezier(.3,.7,.3,1);
    pointer-events:none;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .cursor.pulse{animation:pulse .45s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,224,102,.8)}100%{box-shadow:0 0 0 30px rgba(255,224,102,0)}}
</style></head>
<body>
  <div class="left">
    <div class="brand"><i></i>Gaffer<small>Live demo</small></div>
    <div id="cap"><div class="step" id="step"></div><div class="title" id="title"></div><div class="body" id="body"></div></div>
    <div class="note" id="note"></div>
  </div>
  <div class="phone"><iframe id="app" src="/"></iframe></div>
  <div class="cursor" id="cursor"></div>
<script>
  window.setCaption=function(step,title,body){
    var c=document.getElementById('cap');c.classList.add('out');
    setTimeout(function(){
      document.getElementById('step').textContent=step||'';
      document.getElementById('title').textContent=title||'';
      document.getElementById('body').textContent=body||'';
      c.classList.remove('out');
    },260);
  };
  window.setNote=function(t){document.getElementById('note').textContent=t||'';};
  window.moveCursor=function(x,y){var c=document.getElementById('cursor');c.style.left=x+'px';c.style.top=y+'px';};
  window.clickPulse=function(){var c=document.getElementById('cursor');c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');};
</script>
</body></html>
