<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaffer Media Screen</title>
<style>
:root{color-scheme:dark;--bg:#070E0A;--panel:#0E1A13;--line:#1F3328;--ink:#E8F0EA;--muted:#93A89A;--accent:#2BC27C;--accent-ink:#04160D}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:320px minmax(0,1fr);overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px 24px}
aside h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:4px 8px 4px;color:var(--accent)}
aside p.hint{margin:0 8px 14px;color:var(--muted);font-size:13px;line-height:1.45}
aside h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.list{display:grid;gap:4px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;cursor:pointer}
.item:hover{background:#13241A}
.item[aria-current="true"]{background:#16301F;border-color:var(--accent)}
.item .key{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent-ink);background:var(--accent);border-radius:5px;min-width:20px;text-align:center;padding:1px 5px}
.item .key.none{background:#1F3328;color:var(--muted)}
.item .meta{color:var(--muted);font-size:12px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 4px}
.thumb{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;aspect-ratio:1/1.5}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumbs.wide{grid-template-columns:repeat(2,1fr)}
.thumbs.wide .thumb{aspect-ratio:16/10}
main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;height:100vh}
header.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line)}
header.bar h2{margin:0;font-size:18px}
header.bar .sub{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button,.actions a{background:#16301F;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.actions button:hover,.actions a:hover{border-color:var(--accent)}
#stage{display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;background:#000}
#stage video,#stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;border-radius:6px}
footer.keys{padding:9px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
kbd{font-family:ui-monospace,Menlo,monospace;background:#16301F;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:860px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto;height:auto}aside{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}main{height:auto;min-height:70vh}#stage{min-height:50vh}}
</style></head>
<body>
<aside aria-label="Media list">
  <h1>Gaffer media screen</h1>
  <p class="hint">Keep the script on your other screen. Pick a clip or image here, or use the keyboard.</p>
  <div id="lists"></div>
</aside>
<main>
  <header class="bar"><div><h2 id="title">Loading</h2><div class="sub" id="sub"></div></div>
    <div class="actions"><button id="fs" type="button">Full screen (F)</button><a id="file" href="#" target="_blank" rel="noopener">Open file ↗</a></div></header>
  <div id="stage" aria-live="polite"></div>
  <footer class="keys"><kbd>Space</kbd> play or pause · <kbd>0</kbd> full demo · <kbd>1</kbd>–<kbd>4</kbd> demos 1 to 4 · <kbd>←</kbd> <kbd>→</kbd> previous or next · <kbd>F</kbd> full screen · clips have no sound, so narrate over them</footer>
</main>
<script>
(function(){
  var ITEMS=[{"id":"full","type":"video","group":"Demo clips","title":"Full demo (all four scenes)","meta":"5:04","src":"media/video/gaffer-full-demo.mp4","poster":"media/framed/fairness-1-home.png"},{"id":"fairness","type":"video","group":"Demo clips","title":"Demo 1: Fair playing time","meta":"1:20","src":"media/video/1-fair-playing-time.mp4","poster":"media/framed/fairness-4-plan.png"},{"id":"live","type":"video","group":"Demo clips","title":"Demo 2: Match day","meta":"1:26","src":"media/video/2-match-day.mp4","poster":"media/framed/live-3-goal.png"},{"id":"owner","type":"video","group":"Demo clips","title":"Demo 3: The owner’s view","meta":"1:10","src":"media/video/3-owners-view.mp4","poster":"media/framed/owner-4-scenario.png"},{"id":"develop","type":"video","group":"Demo clips","title":"Demo 4: Player development","meta":"1:08","src":"media/video/4-player-development.mp4","poster":"media/framed/develop-2-profile.png"},{"id":"01-welcome","type":"image","group":"Screenshots","title":"Welcome and club setup","meta":"screenshot","src":"media/screens/01-welcome.png"},{"id":"02-home","type":"image","group":"Screenshots","title":"Home: next match, wage headroom, fairness index","meta":"screenshot","src":"media/screens/02-home.png"},{"id":"08-home-full","type":"image","group":"Screenshots","title":"Home, full page","meta":"screenshot","src":"media/screens/08-home-full.png"},{"id":"03-squad","type":"image","group":"Screenshots","title":"Squad list with minutes and contract flags","meta":"screenshot","src":"media/screens/03-squad.png"},{"id":"11-player-profile","type":"image","group":"Screenshots","title":"Player profile: minutes, skills, trend, contract","meta":"screenshot","src":"media/screens/11-player-profile.png"},{"id":"04-matchday","type":"image","group":"Screenshots","title":"Matchday: fixtures, results and training","meta":"screenshot","src":"media/screens/04-matchday.png"},{"id":"05-availability","type":"image","group":"Screenshots","title":"Availability for the next match","meta":"screenshot","src":"media/screens/05-availability.png"},{"id":"06-plan-window","type":"image","group":"Screenshots","title":"Rotation plan with substitutions at 30 minutes","meta":"screenshot","src":"media/screens/06-plan-window.png"},{"id":"07-fairness-preview","type":"image","group":"Screenshots","title":"Fairness preview against the club minimum","meta":"screenshot","src":"media/screens/07-fairness-preview.png"},{"id":"13-live-sub-due","type":"image","group":"Screenshots","title":"Live match: a substitution window is due","meta":"screenshot","src":"media/screens/13-live-sub-due.png"},{"id":"14-minutes-played","type":"image","group":"Screenshots","title":"Minutes played after full time","meta":"screenshot","src":"media/screens/14-minutes-played.png"},{"id":"15-parent-explainer","type":"image","group":"Screenshots","title":"Parent explainer message","meta":"screenshot","src":"media/screens/15-parent-explainer.png"},{"id":"09-finance-full","type":"image","group":"Screenshots","title":"Finance: wage bill, 24-month chart, contracts, squad shape","meta":"screenshot","src":"media/screens/09-finance-full.png"},{"id":"12-scenario-full","type":"image","group":"Screenshots","title":"Scenario lab: release a keeper, sign a striker","meta":"screenshot","src":"media/screens/12-scenario-full.png"},{"id":"10-develop-full","type":"image","group":"Screenshots","title":"Develop: suggested focus, squad profile, momentum","meta":"screenshot","src":"media/screens/10-develop-full.png"},{"id":"16-web-home","type":"image","group":"Screenshots","title":"Web: home at desktop width","meta":"screenshot","src":"media/screens/16-web-home.png"},{"id":"17-web-finance","type":"image","group":"Screenshots","title":"Web: finance at desktop width","meta":"screenshot","src":"media/screens/17-web-finance.png"},{"id":"18-web-squad","type":"image","group":"Screenshots","title":"Web: squad at desktop width","meta":"screenshot","src":"media/screens/18-web-squad.png"},{"id":"develop-1-overview","type":"image","group":"Phone-framed stills","title":"Develop 1: overview","meta":"still","src":"media/framed/develop-1-overview.png"},{"id":"develop-2-profile","type":"image","group":"Phone-framed stills","title":"Develop 2: profile","meta":"still","src":"media/framed/develop-2-profile.png"},{"id":"develop-3-observation","type":"image","group":"Phone-framed stills","title":"Develop 3: observation","meta":"still","src":"media/framed/develop-3-observation.png"},{"id":"develop-4-report","type":"image","group":"Phone-framed stills","title":"Develop 4: report","meta":"still","src":"media/framed/develop-4-report.png"},{"id":"fairness-1-home","type":"image","group":"Phone-framed stills","title":"Fairness 1: home","meta":"still","src":"media/framed/fairness-1-home.png"},{"id":"fairness-2-alert","type":"image","group":"Phone-framed stills","title":"Fairness 2: alert","meta":"still","src":"media/framed/fairness-2-alert.png"},{"id":"fairness-3-availability","type":"image","group":"Phone-framed stills","title":"Fairness 3: availability","meta":"still","src":"media/framed/fairness-3-availability.png"},{"id":"fairness-4-plan","type":"image","group":"Phone-framed stills","title":"Fairness 4: plan","meta":"still","src":"media/framed/fairness-4-plan.png"},{"id":"fairness-5-changes","type":"image","group":"Phone-framed stills","title":"Fairness 5: changes","meta":"still","src":"media/framed/fairness-5-changes.png"},{"id":"fairness-6-preview","type":"image","group":"Phone-framed stills","title":"Fairness 6: preview","meta":"still","src":"media/framed/fairness-6-preview.png"},{"id":"live-1-ready","type":"image","group":"Phone-framed stills","title":"Live 1: ready","meta":"still","src":"media/framed/live-1-ready.png"},{"id":"live-2-due","type":"image","group":"Phone-framed stills","title":"Live 2: due","meta":"still","src":"media/framed/live-2-due.png"},{"id":"live-3-goal","type":"image","group":"Phone-framed stills","title":"Live 3: goal","meta":"still","src":"media/framed/live-3-goal.png"},{"id":"live-4-fulltime","type":"image","group":"Phone-framed stills","title":"Live 4: fulltime","meta":"still","src":"media/framed/live-4-fulltime.png"},{"id":"live-5-minutes","type":"image","group":"Phone-framed stills","title":"Live 5: minutes","meta":"still","src":"media/framed/live-5-minutes.png"},{"id":"live-6-explainer","type":"image","group":"Phone-framed stills","title":"Live 6: explainer","meta":"still","src":"media/framed/live-6-explainer.png"},{"id":"owner-1-finance","type":"image","group":"Phone-framed stills","title":"Owner 1: finance","meta":"still","src":"media/framed/owner-1-finance.png"},{"id":"owner-2-chart","type":"image","group":"Phone-framed stills","title":"Owner 2: chart","meta":"still","src":"media/framed/owner-2-chart.png"},{"id":"owner-3-retention","type":"image","group":"Phone-framed stills","title":"Owner 3: retention","meta":"still","src":"media/framed/owner-3-retention.png"},{"id":"owner-4-scenario","type":"image","group":"Phone-framed stills","title":"Owner 4: scenario","meta":"still","src":"media/framed/owner-4-scenario.png"}];
  var cur=0, stage=document.getElementById('stage');
  var groups=[]; ITEMS.forEach(function(it){ if(groups.indexOf(it.group)<0) groups.push(it.group); });
  var lists=document.getElementById('lists'), nodes={};
  groups.forEach(function(g){
    var h=document.createElement('h2'); h.textContent=g; lists.appendChild(h);
    var wrap=document.createElement('div');
    var isVid=g==='Demo clips';
    wrap.className=isVid?'list':'thumbs'+(g==='Phone-framed stills'?' wide':'');
    ITEMS.forEach(function(it,i){
      if(it.group!==g) return;
      var b=document.createElement('button'); b.type='button'; b.setAttribute('data-i',i);
      if(isVid){
        b.className='item';
        var k=document.createElement('span'); k.className='key'; k.textContent=it.id==='full'?'0':String(ITEMS.filter(function(x){return x.group===g&&x.id!=='full';}).indexOf(it)+1); b.appendChild(k);
        var t=document.createElement('span'); t.textContent=it.title; b.appendChild(t);
        var m=document.createElement('span'); m.className='meta'; m.textContent=it.meta; b.appendChild(m);
      } else {
        b.className='thumb'; b.title=it.title; b.setAttribute('aria-label',it.title);
        var im=document.createElement('img'); im.src=it.src; im.alt=''; im.loading='lazy'; b.appendChild(im);
      }
      b.addEventListener('click',function(){ select(i,true); });
      nodes[i]=b; wrap.appendChild(b);
    });
    lists.appendChild(wrap);
  });
  function select(i,push){
    if(i<0||i>=ITEMS.length) return;
    cur=i; var it=ITEMS[i];
    Object.keys(nodes).forEach(function(k){ nodes[k].setAttribute('aria-current', String(+k===i)); });
    stage.innerHTML='';
    var el;
    if(it.type==='video'){ el=document.createElement('video'); el.controls=true; el.playsInline=true; el.preload='auto'; el.poster=it.poster||''; el.src=it.src; }
    else { el=document.createElement('img'); el.src=it.src; el.alt=it.title; }
    stage.appendChild(el);
    document.getElementById('title').textContent=it.title;
    document.getElementById('sub').textContent=it.type==='video'?('Video · '+it.meta+' · no audio'):'Image';
    var f=document.getElementById('file'); f.href=it.src;
    document.title=it.title+' · Gaffer media screen';
    if(push){ try{ history.replaceState(null,'','#'+it.id); }catch(e){ location.hash=it.id; } }
    if(nodes[i] && nodes[i].className.indexOf('thumb')===0 && nodes[i].scrollIntoView) nodes[i].scrollIntoView({block:'nearest'});
  }
  function fromHash(){
    var id=(location.hash||'').replace('#','');
    for(var i=0;i<ITEMS.length;i++){ if(ITEMS[i].id===id){ select(i,false); return; } }
    select(0,false);
  }
  function toggleFs(){
    var d=document, el=stage;
    if(d.fullscreenElement){ d.exitFullscreen(); } else if(el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
  }
  document.getElementById('fs').addEventListener('click',toggleFs);
  window.addEventListener('hashchange',fromHash);
  window.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var v=stage.querySelector('video');
    if(e.key===' '||e.code==='Space'){ if(v){ e.preventDefault(); if(v.paused) v.play(); else v.pause(); } }
    else if(e.key==='ArrowRight'){ select((cur+1)%ITEMS.length,true); }
    else if(e.key==='ArrowLeft'){ select((cur-1+ITEMS.length)%ITEMS.length,true); }
    else if(e.key==='f'||e.key==='F'){ toggleFs(); }
    else if(e.key==='0'){ select(0,true); }
    else if(/^[1-4]$/.test(e.key)){ select(+e.key,true); }
  });
  fromHash();
})();
</script>
</body></html>
